name: CI

# run this whenever someone pushes code, on any branch=
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend-build:
    name: Build .NET backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # download the repos on to clean runner

        # installs the actual .NET SDK / Node.js onto that clean machine
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.400"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

  frontend-build:
    name: Build React frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build